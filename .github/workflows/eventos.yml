name: class events

on:
  workflow_dispatch:
    inputs:
      nome:
        required: true
        default: "turma"
        type: string
  push:
    paths:
      - 'src/**'

jobs:
  turma:
    runs-on: ubuntu-latest
    steps:
      - name: Nome da turma
      - env:
          NOME: ${{ inputs.nome }}
        run: |
          echo "oi, $NOME"