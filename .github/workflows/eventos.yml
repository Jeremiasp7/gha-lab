name: class events

on:
  workflow_dispatch:
    inputs:
      nome:
        required: true
        default: "IMD"
        type: string
  push:
    paths:
      - 'src/**'
  schedule:
    - cron: "5 * * * *"

jobs:
  turma:
    runs-on: ubuntu-latest
    steps:
      - name: Nome da turma
        run: |
          echo "${{ inputs.nome }}"