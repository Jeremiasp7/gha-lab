name: 02 - eventos

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Padrão para push"
        required: true
        default: "turma"

  push:
    paths:
      - "src/**"
    
  schedule:
    - cron: "*/5 * * * *"

jobs:
  shake:
    runs-on: ubuntu-latest
    steps:
      - name: "exec"
        env:
          NOME: ${{ inputs.name || 'agendamento' }}
        run: echo "Olá, $NOME ($GITHUB_EVENT_NAME)"
