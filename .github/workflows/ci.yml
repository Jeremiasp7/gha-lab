name: 03 - first ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout/@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r requeriments-dev.txt

      - name: run tests
        run: pytest -v
