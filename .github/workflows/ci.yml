name: first CI pipeline

on:
  push:
    branches:
      - main
  pull_request:


jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: repository checkout
        uses: actions/checkout@v7
      
      - name: python version an so on
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
        
      - name: install requirements and do tests
        run: |
          python pip install requirements-dev.txt
          pytest -v